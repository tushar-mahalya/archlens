# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]

  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!.wrangler/**"
    - "!package-lock.json"
    - "!benchmarks/results/**"
    - "!docs/assets/benchmark.svg"
    - "!**/.archlens-state.json"
    # Generated by tools/sync_portable.py; review the source under plugins/archlens instead.
    - "!skills/archlens/LICENSE"
    - "!skills/archlens/defaults.json"
    - "!skills/archlens/references/**"
    - "!skills/archlens/scripts/**"
    - "!skills/archlens/workflows/**"
    # Search-engine verification files must stay byte-exact.
    - "!site/af83e24b5969ec49b7603348dc2605b2.txt"
    - "!site/google4dcafa1fef06d189.html"

  path_instructions:
    - path: "plugins/archlens/scripts/**/*.py"
      instructions: |
        Runtime checker and hooks. Use only the Python standard library and keep Python 3.9
        compatibility. Do not add a custom YAML parser. Paths and Git calls must work on Linux,
        macOS and Windows. Changes to config, path, report or Git behavior need a regression test
        in tests/. Keep evidence-based results separate from inference, and do not label
        heuristics as official STE compliance. hook.py runs on every Read, Edit, Write and Bash
        call, so flag work that adds latency to its fast path.
    - path: "plugins/archlens/**"
      instructions: |
        The native plugin is the source of truth for the portable skill. A change to shared
        references, defaults, the checker or the workflows must come with regenerated files under
        skills/archlens (python tools/sync_portable.py). Instructions are loaded into agent
        context: flag prompt growth, and any new hook, MCP server, nested agent or automatic
        command without a context-cost note in the PR. Budgets are checked by
        tools/prompt_budget.py and documented in docs/context-efficiency.md.
    - path: "skills/archlens/SKILL.md"
      instructions: |
        Portable router, edited by hand. Keep it short and consistent with the native plugin's
        skills and workflow names.
    - path: "tests/**"
      instructions: |
        Tests use unittest (python -m unittest discover -s tests), not pytest. They must use
        temporary project and home directories, never the developer's agent settings, and must
        pass on Windows (file locks, read-only Git objects, path separators).
    - path: "tools/**"
      instructions: |
        Development scripts. Python scripts use only the standard library. package_release.py builds a deterministic,
        allowlisted ZIP: new release inputs belong in its allowlist and in
        tests/test_distribution.py.
    - path: ".github/workflows/**"
      instructions: |
        Pin every action to a full commit SHA with a version comment, set persist-credentials:
        false on checkout, keep least-privilege permissions and a timeout-minutes on every job.
        A new CI job must be added to the needs of the "CI passed" job, which is the only
        required check.
    - path: ".github/rulesets/**"
      instructions: |
        Rulesets are applied by hand with gh api, not on merge. Check that CONTRIBUTING.md
        "Repository rulesets" still describes the files, and that a new required status check
        exists before it is required.
    - path: "docs/architecture/**"
      instructions: |
        This project's own Archlens handbook. CI runs archlens.py check --strict --style and
        status --fail-on-stale on it. Code citations must point at real line ranges.
    - path: "**/*.md"
      instructions: |
        Plain, direct English: short sentences, active voice, no marketing language. Claims about
        accuracy or performance must match docs/benchmarks.md. User-facing changes need an entry
        in the Unreleased section of CHANGELOG.md.
    - path: "CLA.md"
      instructions: |
        Legal text adapted from the Apache ICLA v2.2. Do not suggest style edits. Flag any change
        to legal substance, and remind the author that CLA Assistant signs against the published
        gist, which must be updated with the same text.
    - path: "site/**"
      instructions: |
        Static website with no build step, deployed to Cloudflare Pages. Keep it dependency-free
        and accessible (alt text, contrast, keyboard use), and keep facts in sync with README.md.

  tools:
    ruff:
      enabled: true
    biome:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    htmlhint:
      enabled: true
    skillspector:
      enabled: true
    github-checks:
      enabled: true
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    shellcheck:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    languagetool:
      enabled: false
    trufflehog:
      enabled: false

chat:
  auto_reply: true
