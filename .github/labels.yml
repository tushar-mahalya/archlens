# Repository labels as code. .github/workflows/sync-labels.yml applies this file on main.
# Labels missing from this file are kept (skip-delete), so remove a label here and in the UI.
# Rename a label with `from_name` to keep it on existing issues and pull requests.

# Type
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: dependencies
  color: "0366d6"
  description: Dependency updates
- name: breaking-change
  color: "b60205"
  description: Changes behavior or configuration in a way users must act on
- name: security
  color: "ee0701"
  description: Hardening or a fix for a security weakness

# Area (applied by .github/labeler.yml)
- name: "area: plugin"
  color: "c5def5"
  description: Native Claude Code plugin and marketplace
- name: "area: skill"
  color: "c5def5"
  description: Portable Agent Skill
- name: "area: checker"
  color: "c5def5"
  description: archlens.py checker and published pre-commit hooks
- name: "area: docs"
  color: "c5def5"
  description: User documentation, handbook, and example
- name: "area: ci"
  color: "c5def5"
  description: Workflows, hooks, and release packaging
- name: "area: site"
  color: "c5def5"
  description: Project website
- name: "area: bench"
  color: "c5def5"
  description: Benchmarks
- name: "area: deps"
  color: "c5def5"
  description: Development dependency manifests

# Triage and status
- name: triage
  color: "fbca04"
  description: Needs maintainer review
- name: question
  color: "d876e3"
  description: Further information is requested
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: accessibility
  color: "f143ab"
  description: Barrier affecting people with disabilities
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: ignore-for-release
  color: "ededed"
  description: Leave out of generated release notes
