name: Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://archlens-docs.pages.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy (see docs/website.md)."
      - name: Deploy site/ to archlens-docs.pages.dev
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.159.0 pages deploy site --project-name archlens-docs --branch main --commit-dirty=true
