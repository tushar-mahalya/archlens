name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The site lives on Cloudflare Pages. This old address keeps working by sending
      # visitors and crawlers there, so links and search results move to one URL.
      - name: Build redirect pages
        run: |
          mkdir -p redirect
          for page in index.html 404.html; do
            cat > "redirect/$page" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Archlens has moved to archlens-docs.pages.dev</title>
          <link rel="canonical" href="https://archlens-docs.pages.dev/">
          <meta http-equiv="refresh" content="0; url=https://archlens-docs.pages.dev/">
          <script>location.replace("https://archlens-docs.pages.dev/" + location.hash);</script>
          </head>
          <body>
          <p>Archlens now lives at <a href="https://archlens-docs.pages.dev/">archlens-docs.pages.dev</a>.</p>
          </body>
          </html>
          HTML
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
