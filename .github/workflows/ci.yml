name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/prompt_budget.py
      - run: python plugins/archlens/scripts/archlens.py check --root examples/order-service --strict
      - run: python plugins/archlens/scripts/archlens.py check --root . --strict
      - run: python tools/package_release.py
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:diagrams
  plugin:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CONFIG_DIR: ${{ runner.temp }}/archlens-claude
      DISABLE_TELEMETRY: '1'
      DISABLE_ERROR_REPORTING: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @anthropic-ai/claude-code@2.1.318
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./plugins/archlens --strict
      - run: claude plugin marketplace add "$GITHUB_WORKSPACE"
      - run: claude plugin install archlens@archlens --scope user
      - run: claude plugin list --json
