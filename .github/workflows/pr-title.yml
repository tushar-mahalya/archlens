# Squash merges use the PR title as the commit on main, so lint it as a Conventional Commit.
# Types match the commit-msg hook in .pre-commit-config.yaml. See CONTRIBUTING.md.
# pull_request_target runs this file from main and never checks out pull request code.
name: PR title
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout; title read via env
    types: [opened, edited, synchronize, reopened]
permissions: {}
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title and commits
    steps:
      - name: Check the title format
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            plugin
            skill
            checker
            docs
            site
            ci
            deps
            bench
          requireScope: false
          subjectPattern: ^(?![A-Z][a-z]).+[^.]$
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start with a lowercase imperative verb
            ("add", not "Add" or "Added") and must not end with a period.
      - name: Check the title length
        # Dependabot generates titles from package names that can be longer.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=${#TITLE}
          if [ "$length" -gt 72 ]; then
            echo "::error title=PR title too long::The title has $length characters. Use 72 or fewer."
            exit 1
          fi
          echo "Title length: $length"
