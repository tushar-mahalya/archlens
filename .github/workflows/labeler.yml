# Label pull requests by changed paths and branch prefix (.github/labeler.yml).
# pull_request_target lets fork PRs be labeled. It reads the config from main through
# the API and never checks out pull request code.
name: Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read .github/labeler.yml from main
      pull-requests: write # add labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
