# Lint settings for the Python in plugins/, tools/, tests/, and examples/.
# The runtime checker must stay standard-library only and run on Python 3.9.
target-version = "py39"

# skills/archlens/scripts is generated by tools/sync_portable.py. Lint its source in plugins/.
# force-exclude applies this when pre-commit passes file names explicitly.
extend-exclude = ["skills/archlens/scripts"]
force-exclude = true

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  # No formatter enforces a line length here, and many lines run past 100 characters.
  "E501",
  # Plain list concatenation, such as `base + [x]` and `lines[:n] + [new] + lines[n:]`,
  # reads better than the unpacking form in this code.
  "RUF005",
]

[lint.isort]
# Sort `import x` and `from x import y` together by module name, as the code already does.
force-sort-within-sections = true
lines-after-imports = 2

[lint.per-file-ignores]
# These lambdas run inside the loop that defines them: `timed()` calls its argument at once.
"tools/benchmark.py" = ["B023"]
"tools/model_benchmark.py" = ["B023"]
